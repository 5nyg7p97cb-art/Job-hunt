name: Job tracker

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: job-tracker

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check boards
        run: python tracker.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save state
        if: ${{ always() }}
        run: |
          git config user.name "job-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json JOBS.md
          git diff --cached --quiet || (git commit -m "jobs update" && git push)
