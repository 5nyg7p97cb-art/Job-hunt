name: Job tracker

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (use "0 * * * *" for hourly on a private repo)
  workflow_dispatch:          # lets you hit "Run workflow" manually

permissions:
  contents: write

concurrency: job-tracker

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check boards
        run: python tracker.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save state
        run: |
          git config user.name "job-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json JOBS.md
          git diff --cached --quiet || (git commit -m "jobs update" && git push)
